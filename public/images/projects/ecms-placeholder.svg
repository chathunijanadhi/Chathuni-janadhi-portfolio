<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e18" />
      <stop offset="50%" stop-color="#1c1726" />
      <stop offset="100%" stop-color="#2a1b3d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e3af2" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(167, 139, 250, 0.25)" />
      <stop offset="100%" stop-color="rgba(244, 114, 182, 0.25)" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#7e3af2" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="220" fill="#f472b6" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="337.5" r="150" fill="#a78bfa" opacity="0.12" filter="url(#glow)" />

  <!-- Abstract UI Frame Mockup -->
  <g transform="translate(150, 85)">
    <!-- Main Window Outer -->
    <rect width="900" height="505" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Window Header -->
    <rect width="900" height="50" rx="16" fill="rgba(0, 0, 0, 0.3)" />
    <!-- Window Controls -->
    <circle cx="30" cy="25" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="50" cy="25" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="70" cy="25" r="6" fill="#10b981" opacity="0.8" />
    <!-- Address Bar Mock -->
    <rect x="110" y="13" width="400" height="24" rx="12" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="130" y="29" fill="rgba(255, 255, 255, 0.4)" font-family="sans-serif" font-size="12">https://ecms-elderlycare.app/doctor/dashboard</text>

    <!-- Sidebar Mock -->
    <rect x="0" y="50" width="200" height="455" fill="rgba(0, 0, 0, 0.2)" />
    <!-- Sidebar Items -->
    <rect x="20" y="80" width="160" height="32" rx="8" fill="url(#pillGrad)" />
    <rect x="20" y="125" width="120" height="12" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <rect x="20" y="150" width="140" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
    <rect x="20" y="175" width="110" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
    <rect x="20" y="200" width="130" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />

    <!-- Main Content Mock -->
    <!-- Dashboard Stats Cards -->
    <g transform="translate(230, 80)">
      <rect x="0" y="0" width="200" height="90" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="30" cy="30" r="14" fill="rgba(167, 139, 250, 0.2)" />
      <rect x="55" y="22" width="80" height="10" rx="5" fill="rgba(255, 255, 255, 0.3)" />
      <rect x="20" y="55" width="120" height="16" rx="4" fill="url(#accentGrad)" />

      <rect x="220" y="0" width="200" height="90" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="250" cy="30" r="14" fill="rgba(244, 114, 182, 0.2)" />
      <rect x="275" y="22" width="80" height="10" rx="5" fill="rgba(255, 255, 255, 0.3)" />
      <rect x="240" y="55" width="100" height="16" rx="4" fill="rgba(255, 255, 255, 0.5)" />

      <rect x="440" y="0" width="200" height="90" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" />
      <circle cx="470" cy="30" r="14" fill="rgba(16, 185, 129, 0.2)" />
      <rect x="495" y="22" width="80" height="10" rx="5" fill="rgba(255, 255, 255, 0.3)" />
      <rect x="460" y="55" width="110" height="16" rx="4" fill="rgba(16, 185, 129, 0.6)" />
    </g>

    <!-- Main Chart / Table View -->
    <rect x="230" y="190" width="640" height="230" rx="12" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.08)" />
    <rect x="250" y="210" width="180" height="14" rx="7" fill="rgba(255, 255, 255, 0.4)" />
    <!-- Table Rows -->
    <rect x="250" y="245" width="600" height="30" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <rect x="250" y="285" width="600" height="30" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <rect x="250" y="325" width="600" height="30" rx="6" fill="rgba(255, 255, 255, 0.04)" />
    <rect x="250" y="365" width="600" height="30" rx="6" fill="rgba(255, 255, 255, 0.04)" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(600, 337.5)" text-anchor="middle">
    <rect x="-240" y="-45" width="480" height="90" rx="20" fill="rgba(18, 14, 24, 0.85)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5" filter="url(#glow)" />
    <text x="0" y="-10" fill="#faf5ff" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" letter-spacing="1">ELDERLY CARE MANAGEMENT SYSTEM</text>
    <text x="0" y="18" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="2">FULL-STACK WEB APPLICATION · ECMS</text>
  </g>
</svg>
